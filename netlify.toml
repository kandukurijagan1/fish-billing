# Netlify Configuration for Aaryan Aqua Billing System

[build]
  command = "exit 0"
  publish = "."

[build.environment]
  NETLIFY_SKIP_INSTALL = "true"
  NPM_FLAGS = "--no-audit --ignore-scripts"

# Security Redirects: Block access to dotfiles, environment files and backend metadata
[[redirects]]
  from = "/.env"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/index.html"
  status = 404
  force = true

# Client-side SPA routing fallback to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTTP Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"

# Force no-cache on HTML so new deploys are always visible
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Force no-cache on JS and CSS (they have cache-buster query params anyway)
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
